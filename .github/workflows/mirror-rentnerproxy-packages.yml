name: Mirror signed RentnerProxy packages

on:
    push:
        branches: [main]
    workflow_dispatch:
    schedule:
        - cron: '7,37 * * * *'

permissions: {}

concurrency:
    group: legacy-rentnerproxy-pages
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'RentnerKev/RentnerKev.github.io' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Read public package data without executing source code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: RentnerProxy/RentnerProxy
                  ref: package-repository
                  path: source
                  persist-credentials: false
                  sparse-checkout: public
            - name: Verify signed snapshot with the existing pinned owner key
              shell: bash
              env:
                  FINGERPRINT: 517046BFFA2C01095A641E07F8E716383322D7C3
              run: |
                  set -Eeuo pipefail
                  python3 - <<'PY'
                  import os
                  import re
                  import stat
                  from pathlib import Path

                  root = Path('source/public')
                  if not stat.S_ISDIR(root.lstat().st_mode):
                      raise ValueError('Public root must be a directory')
                  count = 0
                  for directory, dirs, files in os.walk(root, followlinks=False):
                      for name in dirs + files:
                          path = Path(directory) / name
                          if not re.fullmatch(r'[A-Za-z0-9_.-]+', name) or name.startswith('.'):
                              raise ValueError('Unsafe public path')
                          info = path.lstat()
                          if stat.S_ISDIR(info.st_mode):
                              continue
                          if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_mode & 0o111:
                              raise ValueError('Public files must be ordinary nonexecutable data')
                          count += 1
                          if count > 32768 or info.st_size > 16 * 1024 * 1024:
                              raise ValueError('Public snapshot exceeds distribution limits')
                  PY
                  export GNUPGHOME
                  GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/mirror-gpg-XXXXXXXX")
                  chmod 0700 "$GNUPGHOME"
                  trap 'rm -rf -- "$GNUPGHOME"' EXIT
                  key="source/public/keys/$FINGERPRINT.asc"
                  [[ $(wc -c < "$key") -le 131072 ]]
                  ! grep -q 'PRIVATE KEY' "$key"
                  actual=$(gpg --batch --with-colons --import-options show-only --import "$key" | awk -F: '$1 == "fpr" {print $10; exit}')
                  [[ "$actual" == "$FINGERPRINT" ]]
                  gpg --batch --import "$key"
                  gpg --batch --export "$FINGERPRINT" > "$GNUPGHOME/pinned.gpg"
                  for metadata in catalog.json immutable-files.json; do
                      gpgv --keyring "$GNUPGHOME/pinned.gpg" "source/public/$metadata.asc" "source/public/$metadata"
                  done
                  python3 - <<'PY'
                  import hashlib
                  import json
                  import re
                  from pathlib import Path

                  root = Path('source/public')
                  manifest = json.loads((root / 'immutable-files.json').read_text())
                  if manifest.get('schemaVersion') != 1 or not isinstance(manifest.get('files'), list):
                      raise ValueError('Unsupported immutable manifest')
                  expected = {'catalog.json', 'catalog.json.asc'}
                  for prefix in ('keys', 'releases', 'deliverables'):
                      expected.update(p.relative_to(root).as_posix() for p in (root / prefix).rglob('*') if p.is_file())
                  entries = manifest['files']
                  if not 1 <= len(entries) <= 32768 or len(entries) != len(expected):
                      raise ValueError('Incomplete immutable manifest')
                  seen = set()
                  for entry in entries:
                      name = entry.get('file', '')
                      if not isinstance(name, str) or not re.fullmatch(r'[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*', name):
                          raise ValueError('Unsafe immutable path')
                      if name not in expected or name in seen:
                          raise ValueError('Unknown or duplicate immutable file')
                      path = root / name
                      if path.stat().st_size != entry.get('bytes') or hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != entry.get('sha256'):
                          raise ValueError('Immutable file checksum mismatch')
                      seen.add(name)
                  if seen != expected:
                      raise ValueError('Missing immutable file')
                  catalog = json.loads((root / 'catalog.json').read_text())
                  if not isinstance(catalog, list) or not 1 <= len(catalog) <= 1000:
                      raise ValueError('Invalid signed catalog')
                  PY
                  for channel in alpha beta stable; do
                      gpgv --keyring "$GNUPGHOME/pinned.gpg" "source/public/apt/dists/$channel/InRelease"
                      for architecture in x86_64 aarch64; do
                          metadata="source/public/rpm/$channel/$architecture/repodata/repomd.xml"
                          gpgv --keyring "$GNUPGHOME/pinned.gpg" "$metadata.asc" "$metadata"
                      done
                  done
                  mkdir -p "$RUNNER_TEMP/legacy-pages"
                  cp -a source/public "$RUNNER_TEMP/legacy-pages/RentnerProxy"
            - name: Upload exact verified bytes under the legacy project path
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
              with:
                  path: ${{ runner.temp }}/legacy-pages

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy legacy package repository mirror
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
